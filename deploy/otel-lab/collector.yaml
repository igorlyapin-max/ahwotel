extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  transform/lab:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["device.id", "device.manufacturer", "device.model", "os.name", "os.version", "agent.version", "agent.build", "deployment.environment.name", "monitoring.session.id"])
          - set(attributes["service.name"], "ahwotel")
          - set(attributes["service.instance.id"], attributes["device.id"])
      - context: datapoint
        statements:
          - set(attributes["monitoring.session.id"], resource.attributes["monitoring.session.id"]) where attributes["monitoring.session.id"] == nil
          - set(attributes["stream"], "base") where scope.name == "com.ahwotel.collectors"
          - set(attributes["stream"], "oem") where scope.name == "com.ahwotel.oem"
          - delete_key(attributes, "window.start")
          - delete_key(attributes, "window.duration_ms")
exporters:
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    timeout: 10s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 0s
    sending_queue:
      storage: file_storage
      num_consumers: 1
      queue_size: 10000
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: ${env:OTEL_LOG_LEVEL}
      encoding: json
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/lab]
      exporters: [otlp_http/prometheus]
